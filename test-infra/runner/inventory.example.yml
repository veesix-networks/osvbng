# Copy to inventory.yml (gitignored) and fill in. Everything
# host-specific or secret belongs there, never in this file.
all:
  hosts:
    runner:
      # The address and port the operator dials. An edge firewall may
      # forward this to the host's sshd; ssh_listen_port below is the
      # port sshd actually listens on.
      ansible_host: 203.0.113.10
      ansible_port: 22
      ansible_user: youruser
      ssh_listen_port: 22

  vars:
    # SSH public keys allowed to log in, one entry per key. Password
    # and root logins are disabled outright.
    authorized_keys:
      - ssh-ed25519 AAAA... you@workstation

    # Tool versions. containerlab matches the dev machine so CI and
    # local runs exercise the same deployer.
    containerlab_version: "0.73.0"
    docker_version: "5:28.5.2-1~ubuntu.24.04~noble"

    # One shared org-level runner pool; runner_count is the box's job
    # parallelism. The registration token is passed as an extra-var at
    # run time (see README) and never stored. The org runner group
    # must allow public repositories or the pool sits idle.
    runner_version: "2.328.0"
    runner_labels: osvbng-metal
    runner_org_url: https://github.com/veesix-networks
    runner_count: 5
