# Reusable suite runner shared by every tier: integration (per-PR,
# approval-gated core suites), nightly (full matrix on main) and
# release qualification (full matrix, repeated runs). The image is
# built once per run from the osvbng-vpp dataplane-latest release
# debs, so every suite in a run tests the same image and the same
# dataplane. Callers pass the suite list, the runs count, and the
# environment name; an empty environment means no approval gate,
# which is only correct for already-merged code.

name: suite-run

on:
  workflow_call:
    inputs:
      suites:
        description: JSON array of suite names
        required: true
        type: string
      runs:
        description: Runs per suite
        required: false
        type: number
        default: 1
      environment:
        description: Environment gating the image job; empty for none
        required: false
        type: string
        default: ""
      suite_timeout:
        description: Minutes before a suite job is killed
        required: false
        type: number
        default: 12

jobs:
  image:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, osvbng-metal]
    steps:
      # Plain git instead of actions/checkout: action tarballs come
      # from codeload.github.com, which rate-limits this box's IP under
      # heavy CI use and has taken out entire runs at the checkout
      # step. git fetch uses a different service and the runner's
      # short-lived job token, which is stripped from the remote URL
      # after use.
      - name: Checkout
        run: |
          git init -q .
          # Suites run robot and containerlab under sudo, which leaves
          # root-owned files (test-results, generated certs) in the
          # workspace. checkout -f and clean run unprivileged and fail
          # on them, killing the job before any step output exists.
          sudo chown -R "$(id -u):$(id -g)" .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD
          git clean -qfdx
          git remote set-url origin "https://github.com/${{ github.repository }}"

      # The run heals the box instead of assuming it is clean. This
      # job runs once per run before any suite, and runs serialize,
      # so nothing legitimate is executing on the host here: stray
      # deploy processes and leftover lab containers are residue by
      # definition, and a docker daemon that cannot answer a bounded
      # probe is wedged and gets restarted. Every one of these was a
      # by-hand SSH intervention once; none may ever be again.
      - name: Reset host state
        run: |
          sudo pkill -9 -f 'containerlab deploy' 2>/dev/null || true
          if ! timeout 20 docker info >/dev/null 2>&1; then
            echo "docker unresponsive, restarting"
            sudo systemctl restart docker
            sleep 5
            timeout 20 docker info >/dev/null
          fi
          stray=$(sudo docker ps -aq --filter name=clab-)
          [ -n "$stray" ] && echo "$stray" | xargs -r sudo docker rm -f || true
          # The mgmt network must exist AND be IPv4-only, enforced by
          # shape, not just presence: a dual-stack mgmt network hands
          # every node an eth0 v6 default route that races the test
          # RA route on the access interface, and which route wins
          # flips with RA lifetime timing. That race was the root
          # cause of the ipoe v6 suite flakes. Nothing in the rig
          # needs mgmt IPv6.
          if timeout 20 sudo docker network inspect clab >/dev/null 2>&1; then
            if [ "$(sudo docker network inspect clab -f '{{.EnableIPv6}}')" != "false" ]; then
              echo "mgmt network is dual-stack, recreating v4-only"
              sudo docker network rm clab
            fi
          fi
          timeout 20 sudo docker network inspect clab >/dev/null 2>&1 || \
            timeout 30 sudo docker network create --subnet 172.20.20.0/24 clab
          rm -f "/tmp/osvbng-clab-deploy.$(id -u).lock"

      # Nothing else on the box reclaims docker's churn, and it is the
      # churn that fills the disk: every run rebuilds the osvbng, Kea
      # and xl2tpd images, so the previous ones are left dangling with
      # their layers, and BuildKit's cache grows without bound. A full
      # root filesystem does not fail a job, it takes the runner
      # offline: the service stays active while the agent can no
      # longer write, so all five instances drop at once and the queue
      # stalls silently. That is what happened on 2026-08-28, and the
      # nightlies had been dying that way for days.
      #
      # What is NOT pruned, deliberately:
      #   - volumes. osvbng-vpp-work-debian12 and its ccache are the
      #     VPP build tree, mounted only while a build runs, so
      #     between builds they look unused and `docker volume prune`
      #     would take them. That costs a clean rebuild and the whole
      #     ccache.
      #   - images beyond dangling. `image prune -a` would drop
      #     osvbng:local, the builder image, frr, bngblaster and
      #     bngtester, all of which then have to be pulled or rebuilt.
      - name: Reclaim docker disk
        run: |
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo docker container prune -f || true
          sudo docker image prune -f || true
          sudo docker builder prune -af || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "root free: ${before}G -> ${after}G"
          sudo docker system df || true

      # A rig run needs room for an image rebuild plus every lab a
      # parallel suite brings up. Below this the run is going to fail
      # somewhere unhelpful, or worse take the pool offline mid-sweep,
      # so fail here where the reason is legible. Raise the floor if
      # the image set grows; do not silence it.
      - name: Require free disk
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "root free after reclaim: ${avail}G"
          if [ "$avail" -lt 10 ]; then
            echo "::error::only ${avail}G free on / after reclaim; the rig needs 10G. Something is holding space the prune does not reach: check 'sudo docker system df -v', and 'sudo lsof +L1' for deleted-but-open files."
            exit 1
          fi

      # The runner keeps a per-commit cache of the four debs the
      # image actually installs (the release also carries vpp-dbg,
      # 92MB of symbols the image never uses), so a run downloads
      # nothing unless the dataplane changed since the last run on
      # this box.
      - name: Fetch dataplane artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view dataplane-latest -R veesix-networks/osvbng-vpp \
            --json body -q .body)
          echo "dataplane provenance: $body"
          sha=$(echo "$body" | grep -oE 'from [0-9a-f]{40}' | awk '{print $2}')
          test -n "$sha"
          cache="$HOME/.cache/osvbng-dataplane/$sha"
          if [ ! -d "$cache" ]; then
            tmp=$(mktemp -d)
            for p in 'vpp_*.deb' 'vpp-plugin-core_*.deb' \
                     'vpp-plugin-dpdk_*.deb' 'libvppinfra_*.deb'; do
              gh release download dataplane-latest -R veesix-networks/osvbng-vpp \
                -p "$p" -D "$tmp"
            done
            mkdir -p "$HOME/.cache/osvbng-dataplane"
            mv "$tmp" "$cache"
            ls -dt "$HOME"/.cache/osvbng-dataplane/*/ | tail -n +4 | xargs -r rm -rf
          fi
          mkdir -p docker/dataplane-debs
          cp "$cache"/*.deb docker/dataplane-debs/

      - name: Build osvbng image from dataplane debs
        run: make docker-local

      - name: Build Kea image
        run: make docker-kea-local

      - name: Build xl2tpd image
        run: docker build -t veesixnetworks/xl2tpd:local test-infra/xl2tpd

      - name: Pre-pull suite dependency images
        run: |
          docker pull veesixnetworks/bngblaster:0.9.30
          docker pull frrouting/frr:v8.4.1

  suites:
    needs: image
    runs-on: [self-hosted, osvbng-metal]
    # A wedged suite must be a bounded failure, not a stalled lane:
    # the slowest healthy suites finish in a few minutes, and one
    # deadlocked deploy held two lanes for 20 minutes before this.
    # Callers with repeated runs pass a larger budget.
    timeout-minutes: ${{ inputs.suite_timeout }}
    # No max-parallel: suite concurrency is bounded by the runner
    # pool itself, and an overloaded box shows up as bounded, logged
    # suite timeouts rather than a silently undersized pipeline.
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    steps:
      # Plain git instead of actions/checkout: action tarballs come
      # from codeload.github.com, which rate-limits this box's IP under
      # heavy CI use and has taken out entire runs at the checkout
      # step. git fetch uses a different service and the runner's
      # short-lived job token, which is stripped from the remote URL
      # after use.
      - name: Checkout
        run: |
          git init -q .
          # Suites run robot and containerlab under sudo, which leaves
          # root-owned files (test-results, generated certs) in the
          # workspace. checkout -f and clean run unprivileged and fail
          # on them, killing the job before any step output exists.
          sudo chown -R "$(id -u):$(id -g)" .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD
          git clean -qfdx
          git remote set-url origin "https://github.com/${{ github.repository }}"

      - name: Run ${{ matrix.suite }}
        run: ./scripts/run-qa-tests.sh -r ${{ inputs.runs }} -t ${{ matrix.suite }}

      # Robot says which assertion failed; the daemon says why. This runs
      # before the destroy below, while the lab still exists, because
      # docker logs are gone with the containers. Failure only: a green
      # suite's logs are noise. Without this, a product-side failure on
      # the rig can only be chased by reproducing it locally, and the
      # contention-sensitive ones do not reproduce on an idle box.
      # cancelled() as well as failure(): exceeding timeout-minutes
      # cancels the job rather than failing it, so a failure()-only
      # condition skips exactly the case that most needs a log, a suite
      # that hung. A user-cancelled run captures too, which is cheap.
      - name: Keep container logs on failure
        if: failure() || cancelled()
        run: |
          d="/var/log/osvbng-ci/${{ github.run_id }}/${{ matrix.suite }}"
          sudo mkdir -p "$d"
          for c in $(sudo docker ps -a --filter "name=clab-" --format '{{.Names}}'); do
            sudo sh -c "docker logs '$c' > '$d/$c.log' 2>&1" || true
          done
          sudo sh -c "docker ps -a --filter name=clab- > '$d/containers.txt'" || true

      # A cancelled job kills robot before its suite teardown but not
      # the root-owned sudo children, and an orphaned deploy holds
      # containerlab's locks against every later deploy of that lab.
      # Kill this suite's strays, then destroy its topology. Scoped
      # to this suite only: parallel jobs own other labs on the same
      # box, so never destroy --all here.
      - name: Destroy suite lab
        if: always()
        run: |
          sudo pkill -f "containerlab deploy.*${{ matrix.suite }}" 2>/dev/null || true
          sudo containerlab destroy \
            -t tests/${{ matrix.suite }}/${{ matrix.suite }}.clab.yml \
            --cleanup 2>/dev/null || true

      # The host copy is the evidence store. No upload-artifact: its
      # action tarball downloads during job setup, before any step
      # runs, so continue-on-error cannot save the job when codeload
      # rate-limits this box, and one cold action cache then fails
      # every suite in the sweep at setup.
      - name: Keep robot output on the host
        if: always()
        run: |
          d="/var/log/osvbng-ci/${{ github.run_id }}/${{ matrix.suite }}"
          sudo mkdir -p "$d"
          sudo cp -r tests/out/. "$d"/ 2>/dev/null || true
          sudo find /var/log/osvbng-ci -maxdepth 1 -mtime +7 -exec rm -rf {} + 2>/dev/null || true
