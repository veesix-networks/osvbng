# Build and unit tests only. The integration suites live in
# integration.yml: approval-gated on the self-hosted pool, with the
# suite matrix generated from tests/ instead of listed by hand.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  file-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'docker/**'
              - 'api/proto/**'
              - 'templates/**'
              - 'tests/**'
              - '.github/workflows/**'

  # Lint only what the pull request introduces. A full run currently
  # reports a backlog inherited from before any lint gate existed, so
  # gating on it wholesale would fail every PR regardless of its
  # content. --new-from-rev scopes the gate to the diff, which stops new
  # findings landing while the backlog is burned down separately. This
  # job is deliberately pull-request only: on a push to main there is no
  # diff to scope to.
  lint:
    runs-on: ubuntu-latest
    needs: file-changes
    if: github.event_name == 'pull_request' && needs.file-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load versions
        id: versions
        run: |
          source versions.env
          echo "golang_version=${GOLANG_VERSION}" >> $GITHUB_OUTPUT
          echo "golangci_version=${GOLANGCI_LINT_VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.golang_version }}

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.versions.outputs.golangci_version }}

      - name: Lint changed code
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          golangci-lint run --new-from-rev="origin/${{ github.base_ref }}"

  build:
    runs-on: ubuntu-latest
    needs: file-changes
    if: needs.file-changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load versions
        id: versions
        run: |
          source versions.env
          echo "golang_version=${GOLANG_VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.golang_version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: make build

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Unit tests
        run: make test-report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/unit-tests.xml
          retention-days: 30

      - name: Test report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: build/reports/unit-tests.xml
          reporter: java-junit
