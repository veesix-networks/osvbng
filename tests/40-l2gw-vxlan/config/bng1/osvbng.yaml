l2gw:
    handoff-groups:
        isp-blue:
            interface: vxlan-isp-blue
            vlan-tpid: dot1q
            svlan-range: "200-204"
            cvlan-range: "10-10"

subscriber-groups:
    groups:
        wholesale:
            vlan-tpid: dot1q
            vlans:
                - svlan: "100-110"
                  cvlan: any
                  parent-interface: vxlan-an1
                  access-types: [l2gw]
            l2gw:
                handoff-group: isp-blue
            aaa-policy: default-policy

interfaces:
    eth1:
        description: Access underlay
        enabled: true
        mtu: 9000
        address:
            ipv4: [10.99.1.1/24]
    eth2:
        description: ISP underlay
        enabled: true
        mtu: 9000
        address:
            ipv4: [10.99.2.1/24]
    vxlan-an1:
        description: Access operator NNI (VXLAN)
        enabled: true
        vxlan:
            src: 10.99.1.1
            dst: 10.99.1.2
            vni: 10101
    vxlan-isp-blue:
        description: ISP blue handoff (VXLAN)
        enabled: true
        vxlan:
            src: 10.99.2.1
            dst: 10.99.2.2
            vni: 10201

aaa:
    auth_provider: radius
    nas_identifier: osvbng
    policy:
        - name: default-policy
          format: $mac-address$
          password: secret
          max_concurrent_sessions: 1

plugins:
    exporter.prometheus:
        enabled: true
        listen_address: :9090
    northbound.api:
        enabled: true
        listeners:
            - address: :8080
    subscriber.auth.radius:
        servers:
            - host: 172.20.41.10
              secret: testing123
        nas_ip: 172.20.41.2
        coa_clients:
            - host: 172.20.41.0/24
              secret: testing123

monitoring:
  collect_interval: 30s

logging:
    format: text
    level: info
    components:
        aaa: debug
        l2gw: debug
        dataplane: debug

dataplane:
    lcp-netns: dataplane
    statseg:
        size: "512m"
        page-size: "4k"
        per-node-counters: false
