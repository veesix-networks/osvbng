#
# L2GW over VXLAN overlay: both NNIs arrive as VXLAN tunnels instead of
# physical ports. The subscribers container emulates the leaf stitches
# with linux vxlan endpoints bridged to the blaster access / a10nsp
# interfaces; no switch NOS involved.

name: osvbng-l2gw-vxlan

mgmt:
  network: clab-40vx
  ipv4-subnet: ${OSVBNG_LAB_MGMT_PREFIX:=172.20}.41.0/24

topology:
  nodes:
    bng1:
      kind: linux
      image: veesixnetworks/osvbng:local
      image-pull-policy: Never
      mgmt-ipv4: 172.20.41.2
      cap-add:
        - SYS_ADMIN
        - NET_ADMIN
        - IPC_LOCK
        - SYS_NICE
      env:
        OSVBNG_WAIT_FOR_INTERFACES: "true"
        OSVBNG_NUM_INTERFACES: "3"
        OSVBNG_DP_WORKER_CORES: "${OSVBNG_LAB_WORKER_CORES:=auto}"
        OSVBNG_CP_CORES: "${OSVBNG_LAB_CP_CORES:=auto}"
        OSVBNG_RESPAWN: "true"
      binds:
        - config/bng1/osvbng.yaml:/etc/osvbng/osvbng.yaml:ro

    subscribers:
      kind: linux
      image: veesixnetworks/bngblaster:0.9.30
      cap-add:
        - NET_ADMIN
      binds:
        - config/subscribers/config.json:/config/config.json:ro
      exec:
        - ip addr add 10.99.1.2/24 dev eth1
        - ip addr add 10.99.2.2/24 dev eth2
        - ip link add vxlan-acc type vxlan id 10101 local 10.99.1.2 remote 10.99.1.1 dstport 4789 dev eth1
        - ip link add vxlan-isp type vxlan id 10201 local 10.99.2.2 remote 10.99.2.1 dstport 4789 dev eth2
        - ip link add br-acc type bridge
        - ip link add br-isp type bridge
        - ip link add acc0 mtu 8900 type veth peer name acc0b mtu 8900
        - ip link add isp0 mtu 8900 type veth peer name isp0b mtu 8900
        - ip link set vxlan-acc master br-acc
        - ip link set acc0b master br-acc
        - ip link set vxlan-isp master br-isp
        - ip link set isp0b master br-isp
        - ip link set vxlan-acc up
        - ip link set vxlan-isp up
        - ip link set acc0b up
        - ip link set isp0b up
        - ip link set acc0 up
        - ip link set isp0 up
        - ip link set br-acc up
        - ip link set br-isp up

    freeradius:
      kind: linux
      image: freeradius/freeradius-server:3.2.7
      mgmt-ipv4: 172.20.41.10
      binds:
        - config/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
        - config/freeradius/authorize:/etc/freeradius/mods-config/files/authorize:ro
        - config/freeradius/dictionary:/etc/freeradius/dictionary:ro
        - ../../contrib/freeradius/dictionary.osvbng:/etc/freeradius/dictionary.osvbng:ro
      exec:
        - bash -c "freeradius -X &"

  links:
    - endpoints: [bng1:eth1, subscribers:eth1]
      mtu: 9000
    - endpoints: [bng1:eth2, subscribers:eth2]
      mtu: 9000
