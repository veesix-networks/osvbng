name: osvbng-ipoe-hqos-svlan

# v4-only mgmt: without an explicit subnet containerlab creates a
# dual-stack network whose static v6 default route on eth0 competes
# with the test RA route and breaks subscriber-originated IPv6.
mgmt:
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    bng1:
      kind: linux
      image: veesixnetworks/osvbng:local
      image-pull-policy: Never
      cap-add:
        - SYS_ADMIN
        - NET_ADMIN
        - IPC_LOCK
        - SYS_NICE
      env:
        OSVBNG_WAIT_FOR_INTERFACES: "true"
        OSVBNG_NUM_INTERFACES: "3"
      binds:
        - config/bng1/osvbng.yaml:/etc/osvbng/osvbng.yaml:ro

    # bngblaster holds both ends: eth1 emulates the QinQ subscribers,
    # eth2 is the network side sourcing the downstream streams, so
    # per-session shares are measured against real forwarded traffic.
    subscribers:
      kind: linux
      image: veesixnetworks/bngblaster:0.9.30
      cap-add:
        - NET_ADMIN
      binds:
        - config/subscribers/config.json:/config/config.json:ro

  links:
    - endpoints: [bng1:eth1, subscribers:eth1]
      mtu: 1500
    - endpoints: [bng1:eth2, subscribers:eth2]
      mtu: 1500
