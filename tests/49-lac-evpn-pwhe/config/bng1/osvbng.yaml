subscriber-groups:
    groups:
        pppoe-lac:
            vlan-tpid: dot1q
            vlans:
                - svlan: "200-210"
                  cvlan: any
                  interface: loop100
                  parent-interface: pw-an1
                  access-types: [lac]
            aaa-policy: pppoe-policy
            l2tp:
                profile: L2TP_LAC_DEFAULT

l2tp:
    tunnel-pools:
        LNS_POOL:
            local-name: bng1
            lns:
                - name: bngblaster-lns
                  ipv4: 10.0.0.2
                  source-ipv4: 10.0.0.1
                  secret: shared
                  preference: 100
    profiles:
        L2TP_LAC_DEFAULT:
            session-limit: 1000
            hello-interval: 60s
            receive-window-size: 16
            tunnel-pool: LNS_POOL
            max-attempts-per-subscriber: 4

ipv4-profiles:
    default:
        gateway: 10.255.0.1
        pools:
            - name: subscriber-pool
              network: 10.255.0.0/16
              priority: 1

interfaces:
    eth1:
        description: Fabric underlay
        enabled: true
        mtu: 9000
        address:
            ipv4:
                - 10.99.1.1/24
    loop0:
        description: VTEP loopback
        enabled: true
        address:
            ipv4:
                - 10.254.1.1/32
    vxlan-an1:
        description: Access operator NNI transport (EVPN-signaled)
        enabled: true
        vxlan:
            src-interface: loop0
            vni: 10101
            signaling: evpn
    pw-an1:
        description: Access operator pseudowire headend
        enabled: true
        mtu: 1508
        pseudowire:
            transport: vxlan-an1
    eth2:
        description: L2TP backbone (LNS reachability)
        enabled: true
        address:
            ipv4:
                - 10.0.0.1/30
    loop100:
        description: Subscriber Gateway Loopback
        enabled: true
        address:
            ipv4:
                - 10.255.0.1/32

protocols:
    bgp:
        asn: 65000
        router-id: 10.254.1.1
        neighbors:
            10.99.1.2:
                remote-as: 65000
        ipv4-unicast:
            redistribute:
                connected: true
        l2vpn-evpn:
            advertise-all-vni: true
            neighbors:
                10.99.1.2: {}

aaa:
    auth_provider: local
    nas_identifier: osvbng
    policy:
        # LAC mode: osvbng does not authenticate the subscriber. The LNS
        # validates CHAP via the proxy-auth AVPs we forward in ICCN.
        # Local auth is used purely as a lookup table: agent-remote-id
        # -> Tunnel-* attributes that pick the LNS.
        - name: pppoe-policy
          type: ppp
          format: $agent-remote-id$
          authenticate: false
          max_concurrent_sessions: 1

plugins:
    exporter.prometheus:
        enabled: true
        listen_address: :9090
    northbound.api:
        enabled: true
        listeners:
            - address: :8080
    subscriber.auth.local:
        allow_all: false
        database_path: /tmp/osvbng.db

monitoring:
    collect_interval: 30s

logging:
    format: text
    level: info
    components:
        aaa: debug
        pppoe: debug
        l2tp: debug
        routing: debug
        dataplane: debug
        southbound: debug

dataplane:
    lcp-netns: dataplane
    statseg:
        size: "512m"
        page-size: "4k"
        per-node-counters: false
