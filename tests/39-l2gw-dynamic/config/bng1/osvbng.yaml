l2gw:
    handoff-groups:
        isp-blue:
            interface: eth2
            vlan-tpid: dot1q
            svlan-range: "200-204"
            cvlan-range: "10-10"

subscriber-groups:
    groups:
        wholesale:
            vlan-tpid: dot1q
            vlans:
                - svlan: "100-110"
                  cvlan: any
                  parent-interface: eth1
                  access-types: [l2gw]
            l2gw:
                handoff-group: isp-blue
            aaa-policy: default-policy

interfaces:
    eth1:
        description: Access Interface
        enabled: true
    eth2:
        description: Handoff (ISP blue)
        enabled: true

aaa:
    auth_provider: radius
    nas_identifier: osvbng
    policy:
        - name: default-policy
          format: $mac-address$
          password: secret
          max_concurrent_sessions: 1

plugins:
    exporter.prometheus:
        enabled: true
        listen_address: :9090
    northbound.api:
        enabled: true
        listeners:
            - address: :8080
    # l2gw.* VSAs ride the built-in osvbng vendor dictionary (interim
    # PEN 32473); no response/accounting mappings needed.
    subscriber.auth.radius:
        servers:
            - host: 172.20.38.10
              secret: testing123
        nas_ip: 172.20.38.2
        coa_clients:
            - host: 172.20.38.0/24
              secret: testing123

monitoring:
  collect_interval: 30s

logging:
    format: text
    level: info
    components:
        aaa: debug
        l2gw: debug
        dataplane: debug

dataplane:
    lcp-netns: dataplane
    statseg:
        size: "512m"
        page-size: "4k"
        per-node-counters: false
