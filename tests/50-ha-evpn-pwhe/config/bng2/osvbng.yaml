subscriber-groups:
    groups:
        default:
            vlan-tpid: dot1q
            ipv4-profile: default
            vlans:
                - svlan: "100-110"
                  cvlan: any
                  interface: loop100
                  parent-interface: pw-an1
                  access-types: [ipoe]
            aaa-policy: default-policy

ipv4-profiles:
    default:
        gateway: 10.255.0.1
        dns:
            - 8.8.8.8
        pools:
            - name: subscriber-pool
              network: 10.255.0.0/16
              priority: 1
        dhcp:
            lease-time: 3600

dhcp:
    provider: local

interfaces:
    eth1:
        description: Fabric underlay
        enabled: true
        mtu: 9000
        address:
            ipv4:
                - 10.98.2.1/24
    loop0:
        description: Anycast VTEP loopback
        enabled: true
        address:
            ipv4:
                - 10.254.1.1/32
    vxlan-an1:
        description: Access operator NNI transport (EVPN-signaled)
        enabled: true
        vxlan:
            src-interface: loop0
            vni: 10101
            signaling: evpn
    pw-an1:
        description: Access operator pseudowire headend
        enabled: true
        mtu: 1508
        pseudowire:
            transport: vxlan-an1
            mac-address: "02:00:5e:00:01:01"
    loop100:
        description: Subscriber Gateway Loopback
        enabled: true
        address:
            ipv4:
                - 10.255.0.1/32

protocols:
    bgp:
        asn: 65000
        router-id: 10.253.1.2
        neighbors:
            10.98.2.2:
                remote-as: 65000
        ipv4-unicast: {}
        l2vpn-evpn:
            advertise-all-vni: true
            neighbors:
                10.98.2.2: {}

ha:
    enabled: true
    node_id: bng-2
    peer:
        address: clab-osvbng-ha-evpn-pwhe-bng1:50051
    heartbeat:
        interval: 1s
        timeout: 5s
    srgs:
        default:
            virtual_mac: "02:00:5e:00:01:01"
            priority: 50
            subscriber_groups:
                - default
            interfaces:
                - eth1
            preempt: true
            networks:
                - prefix: 10.254.1.1/32

aaa:
    auth_provider: local
    nas_identifier: osvbng
    policy:
        - name: default-policy
          format: $remote-id$

plugins:
    exporter.prometheus:
        enabled: true
        listen_address: :9090
    northbound.api:
        enabled: true
        listeners:
            - address: :8080
    subscriber.auth.local:
        allow_all: true
        database_path: /tmp/osvbng.db

monitoring:
  collect_interval: 30s

logging:
    format: text
    level: info
    components:
        ha: debug
        ipoe: debug
        routing: debug
        dataplane: debug

dataplane:
    lcp-netns: dataplane
    statseg:
        size: "512m"
        page-size: "4k"
        per-node-counters: false
