name: osvbng-cgnat-restart-idempotent

# v4-only mgmt: without an explicit subnet containerlab creates a
# dual-stack network whose static v6 default route on eth0 competes
# with the test RA route and breaks subscriber-originated IPv6.
mgmt:
  ipv4-subnet: ${OSVBNG_LAB_MGMT_PREFIX:=172.20}.20.0/24

topology:
  nodes:
    bng1:
      kind: linux
      image: veesixnetworks/osvbng:local
      image-pull-policy: Never
      cap-add:
        - SYS_ADMIN
        - NET_ADMIN
        - IPC_LOCK
        - SYS_NICE
      env:
        OSVBNG_WAIT_FOR_INTERFACES: "true"
        OSVBNG_NUM_INTERFACES: "3"
        OSVBNG_DP_WORKER_CORES: "${OSVBNG_LAB_WORKER_CORES:=auto}"
        OSVBNG_CP_CORES: "${OSVBNG_LAB_CP_CORES:=auto}"
        OSVBNG_RESPAWN: "true"
      binds:
        - config/bng1/osvbng.yaml:/etc/osvbng/osvbng.yaml:ro

    corerouter1:
      kind: linux
      image: frrouting/frr:v8.4.1
      cap-add:
        - SYS_ADMIN
        - NET_ADMIN
      binds:
        - config/corerouter1/daemons:/etc/frr/daemons:ro
        - config/corerouter1/frr.conf:/etc/frr/frr.conf:ro
        - config/corerouter1/entrypoint.sh:/entrypoint.sh:ro
      exec:
        - bash /entrypoint.sh

    subscribers:
      kind: linux
      image: veesixnetworks/bngblaster:0.9.30
      binds:
        - config/subscribers/config.json:/config/config.json:ro

  links:
    - endpoints: [bng1:eth1, subscribers:eth1]
      mtu: 1500
    - endpoints: [bng1:eth2, corerouter1:eth1]
      mtu: 1500
    - endpoints: [corerouter1:eth2, subscribers:eth2]
      mtu: 1500
