frr defaults datacenter
hostname leaf
!
router bgp 65000
 neighbor 10.99.1.1 remote-as 65000
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.99.1.1 activate
  advertise-all-vni
 exit-address-family
!
line vty
!
