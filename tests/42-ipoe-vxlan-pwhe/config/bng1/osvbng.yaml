subscriber-groups:
    groups:
        default:
            vlan-tpid: dot1q
            ipv4-profile: default
            vlans:
                - svlan: "100-110"
                  cvlan: any
                  interface: loop100
                  parent-interface: pw-an1
                  access-types: [ipoe]
            aaa-policy: default-policy

ipv4-profiles:
    default:
        gateway: 10.255.0.1
        dns:
            - 8.8.8.8
            - 8.8.4.4
        pools:
            - name: subscriber-pool
              network: 10.255.0.0/16
              priority: 1
        dhcp:
            lease-time: 3600

dhcp:
    provider: local

interfaces:
    eth1:
        description: Access underlay
        enabled: true
        mtu: 9000
        address:
            ipv4:
                - 10.99.1.1/24
    vxlan-an1:
        description: Access operator NNI transport (VXLAN)
        enabled: true
        vxlan:
            src: 10.99.1.1
            dst: 10.99.1.2
            vni: 10101
    pw-an1:
        description: Access operator pseudowire headend
        enabled: true
        pseudowire:
            transport: vxlan-an1
    loop100:
        description: Subscriber Gateway Loopback
        enabled: true
        address:
            ipv4:
                - 10.255.0.1/32

aaa:
    auth_provider: local
    nas_identifier: osvbng
    policy:
        - name: default-policy
          format: $remote-id$

plugins:
    exporter.prometheus:
        enabled: true
        listen_address: :9090
    northbound.api:
        enabled: true
        listeners:
            - address: :8080
    subscriber.auth.local:
        allow_all: true
        database_path: /tmp/osvbng.db

monitoring:
  collect_interval: 30s

logging:
    format: text
    level: info
    components:
        aaa: debug
        ipoe: debug
        dataplane: debug

dataplane:
    lcp-netns: dataplane
    statseg:
        size: "512m"
        page-size: "4k"
        per-node-counters: false
