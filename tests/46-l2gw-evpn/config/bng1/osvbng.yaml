l2gw:
    handoff-groups:
        isp-blue:
            interface: vxlan-isp-blue
            vlan-tpid: dot1q
            svlan-range: "200-204"
            cvlan-range: "10-10"

subscriber-groups:
    groups:
        wholesale:
            vlan-tpid: dot1q
            vlans:
                - svlan: "100-110"
                  cvlan: any
                  parent-interface: vxlan-an1
                  access-types: [l2gw]
            l2gw:
                handoff-group: isp-blue
            aaa-policy: default-policy

interfaces:
    loop0:
        description: VTEP loopback
        enabled: true
        address:
            ipv4:
                - 10.255.1.1/32
    eth1:
        description: Fabric underlay
        enabled: true
        mtu: 9000
        address:
            ipv4: [10.99.1.1/24]
    vxlan-an1:
        description: Access operator NNI (EVPN-signaled)
        enabled: true
        vxlan:
            src-interface: loop0
            vni: 10101
            signaling: evpn
    vxlan-isp-blue:
        description: ISP blue handoff (EVPN-signaled)
        enabled: true
        vxlan:
            src-interface: loop0
            vni: 10201
            signaling: evpn

protocols:
    bgp:
        asn: 65000
        router-id: 10.255.1.1
        neighbors:
            10.99.1.2:
                remote-as: 65000
        ipv4-unicast:
            redistribute:
                connected: true
        l2vpn-evpn:
            advertise-all-vni: true
            neighbors:
                10.99.1.2: {}

aaa:
    auth_provider: radius
    nas_identifier: osvbng
    policy:
        - name: default-policy
          format: $mac-address$
          password: secret
          max_concurrent_sessions: 1

plugins:
    exporter.prometheus:
        enabled: true
        listen_address: :9090
    northbound.api:
        enabled: true
        listeners:
            - address: :8080
    subscriber.auth.radius:
        servers:
            - host: 172.20.26.10
              secret: testing123
        nas_ip: 172.20.26.2
        coa_clients:
            - host: 172.20.26.0/24
              secret: testing123

monitoring:
  collect_interval: 30s

logging:
    format: text
    level: info
    components:
        aaa: debug
        l2gw: debug
        routing: debug
        dataplane: debug

dataplane:
    lcp-netns: dataplane
    statseg:
        size: "512m"
        page-size: "4k"
        per-node-counters: false
