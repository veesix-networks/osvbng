frr version 10
frr defaults traditional
hostname corerouter1
log syslog informational
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.0.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.254.0.2/32
 ip ospf area 0.0.0.0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.254.0.2
 log-adjacency-changes
exit
!
! Return path for the CGNAT outside pool. Static rather than BGP: this
! suite asserts ICMP error handling, and one fewer protocol to converge
! is one fewer reason for it to be flaky.
ip route 203.0.113.0/28 10.0.0.1
!
line vty
!
